{{ define "main" }}
<div class="listing">
  <h1 class="listing__title">{{ .Title }}</h1>
  {{- with .Content }}
  <div class="listing__intro prose">{{ . }}</div>
  {{- end }}
  <ul class="terms">
    {{- range .Data.Terms.Alphabetical }}
    <li>
      <a href="{{ .Page.RelPermalink }}">{{ if eq $.Data.Plural "tags" }}#{{ end }}{{ .Page.Title }}</a>
      <span class="terms__count">{{ .Count }}</span>
    </li>
    {{- end }}
  </ul>
</div>
{{ end }}
