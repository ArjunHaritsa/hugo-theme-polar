{{ define "main" }}
{{- .Store.Set "scripts" (slice "typewriter") }}
<article class="about">
  {{- with partial "cover-url.html" . }}
  <header class="about__header">
    <figure class="profile">
      <img class="profile__photo" src="{{ . }}" alt="{{ $.Params.coverAlt | default (site.Params.author | default $.Title) }}" width="200" height="200" decoding="async">
      {{- if $.Params.showPostCount }}
      <p class="profile__count">
        <span class="profile__count-label">{{ T "posts" }}</span>
        <span class="profile__count-value">{{ len (partial "posts.html" $) }}</span>
      </p>
      {{- end }}
      {{- with $.Params.coverCaption }}
      {{ partial "typed-caption.html" . }}
      {{- end }}
    </figure>
  </header>
  {{- end }}

  <div class="about__content prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
