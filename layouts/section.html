{{ define "main" }}
{{- .Store.Set "scripts" (slice "post-filter") }}
<div class="listing">
  {{- with .Content }}
  <div class="listing__intro prose">{{ . }}</div>
  {{- end }}

  <form class="filters" role="search" data-post-filter hidden>
    <label class="filters__search">
      <span class="visually-hidden">{{ T "searchLabel" }}</span>
      <input type="search" name="q" placeholder="{{ T "searchPlaceholder" }}" autocomplete="off">
      <span class="filters__icon" aria-hidden="true">󰱼</span>
    </label>
    {{- with site.Params.postLanguages }}
    <label class="filters__language">
      <span>{{ T "language" }}</span>
      <select name="language">
        <option value="all">{{ T "languageAll" }}</option>
        {{- range . }}
        <option value="{{ .code }}"{{ with .code }} lang="{{ . }}"{{ end }}>{{ .label }}</option>
        {{- end }}
      </select>
    </label>
    {{- end }}
    <div class="filters__categories" hidden>
      <span class="filters__label" id="categories-label">{{ T "categories" }}</span>
      <div class="chips" role="group" aria-labelledby="categories-label" data-all-label="{{ T "categoryAll" }}"></div>
    </div>
  </form>

  {{ partial "post-archive.html" .RegularPages }}
  <p class="listing__empty" data-no-results hidden>{{ T "noResults" }}</p>
</div>
{{ end }}
