{{- with .Paginator }}
{{- if or .HasPrev .HasNext }}
<nav class="pager" aria-label="{{ T "pagination" }}">
  {{- with .Prev }}
  <a class="button pager__prev" href="{{ .URL }}" rel="prev">← {{ T "newerPosts" }}</a>
  {{- end }}
  {{- with .Next }}
  <a class="button pager__next" href="{{ .URL }}" rel="next">{{ T "olderPosts" }} →</a>
  {{- end }}
</nav>
{{- end }}
{{- end }}
